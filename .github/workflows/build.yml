name: build

on:
  push:
    branches: [master, feature/**]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # needed to attach files to a Release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]  # macos-14 = Apple Silicon
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Download models (bundled into the app, not committed)
        run: python scripts/fetch_models.py

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/moodmusic.spec --noconfirm

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The exe is windowed and may have no console, so read the result file.
          $p = Start-Process -FilePath dist\MoodMusic\MoodMusic.exe `
            -ArgumentList "--selftest","--selftest-out","$env:RUNNER_TEMP\selftest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\selftest.txt" -Pattern "SELFTEST OK" -Quiet)) { exit 1 }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/MoodMusic.app/Contents/MacOS/MoodMusic --selftest --selftest-out "$RUNNER_TEMP/selftest.txt"
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "SELFTEST OK" "$RUNNER_TEMP/selftest.txt"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\MoodMusic -DestinationPath MoodMusic-windows.zip

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Mood Music" -srcfolder dist/MoodMusic.app -ov -format UDZO MoodMusic-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MoodMusic-${{ runner.os }}
          path: |
            MoodMusic-windows.zip
            MoodMusic-macos-arm64.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MoodMusic-windows.zip
            MoodMusic-macos-arm64.dmg
